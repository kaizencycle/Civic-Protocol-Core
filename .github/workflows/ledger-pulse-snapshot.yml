# C-287 / C-288 — Mesh execution fabric (ledger node): snapshot public pulse inputs
# Declared in mobius.yaml → jobs.workflows[]. Declares no writes to remote services;
# only commits a JSON artifact for Substrate / HIVE / browser-shell consumers.

name: Ledger Pulse Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */1 * * *"

permissions:
  contents: write

concurrency:
  group: ledger-pulse-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      # Optional repo variable LEDGER_PUBLIC_URL; Python falls back to Render default.
      LEDGER_PUBLIC_URL: ${{ vars.LEDGER_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch health and EPICON feed head
        run: |
          set -e
          mkdir -p ledger
          python3 << 'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          from scripts.ledger_pulse_probe import (
              UnsafeProbeUrlError,
              probe_json_url,
              validate_ledger_public_base,
          )

          default_base = "https://civic-protocol-core-ledger.onrender.com"
          raw_base = (os.environ.get("LEDGER_PUBLIC_URL") or "").strip() or default_base
          try:
              base = validate_ledger_public_base(raw_base)
          except UnsafeProbeUrlError as exc:
              raise SystemExit(f"Invalid LEDGER_PUBLIC_URL: {exc}") from exc

          health = probe_json_url(f"{base}/health").to_snapshot_dict()
          feed = probe_json_url(f"{base}/epicon/feed?limit=10").to_snapshot_dict()

          out = {
              "schema": "MNS_LEDGER_PULSE_SNAPSHOT_V1",
              "node_id": "civic-protocol-core",
              "captured_at": datetime.now(timezone.utc).isoformat(),
              "ledger_base_url": base,
              "health": health,
              "epicon_feed": feed,
          }
          path = "ledger/mesh-pulse-snapshot.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print("Wrote", path)
          PY

      - name: Commit snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "mobius-bot"
          git config user.email "bot@mobius.substrate"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add ledger/mesh-pulse-snapshot.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore(ledger): mesh pulse snapshot [skip ci]"
            git push
          fi
